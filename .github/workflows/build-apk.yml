name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Node.js
       uses: actions/setup-node@v4
       with:
         node-version: '18'

     - name: Build PWA to APK with PWABuilder CLI
       uses: pwabuilder/pwabuilder-android-action@main
       with:
         url: https://puregrows112.github.io/MY-CLOUS/
         name: My Closet
         package_id: com.puregrows.mycloset

     - name: Upload APK Artifact
       uses: actions/upload-artifact@v4
       with:
         name: app-apk
         path: android/app/build/outputs/apk/debug/*.apk
